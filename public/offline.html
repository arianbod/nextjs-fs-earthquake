<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <title>Offline - QuakeWise</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .container {
      max-width: 480px;
      text-align: center;
    }

    .icon-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    .icon {
      width: 64px;
      height: 64px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 32px;
    }

    .retry-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: #1e3a5f;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .retry-button:active {
      transform: translateY(0);
    }

    .retry-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .retry-icon {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .retry-button:hover .retry-icon {
      transform: rotate(180deg);
    }

    .retry-button.loading .retry-icon {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status {
      margin-top: 48px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      margin-right: 8px;
      animation: blink 1.5s ease-in-out infinite;
    }

    .status-dot.online {
      background: #10b981;
      animation: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .cached-pages {
      margin-top: 24px;
      text-align: left;
    }

    .cached-pages h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .cached-link {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .cached-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1 id="title">You're Offline</h1>
    <p id="message">
      It looks like you've lost your internet connection.
      Don't worry - QuakeWise will work again once you're back online.
    </p>

    <button class="retry-button" id="retryButton">
      <svg class="retry-icon" id="retryIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span id="retryText">Try Again</span>
    </button>

    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Waiting for connection...</span>
    </div>

    <div class="cached-pages" id="cachedPages" style="display: none;">
      <h3 id="cachedPagesTitle">Available Offline:</h3>
      <a href="/" class="cached-link" id="homeLink">Home</a>
    </div>
  </div>

  <script>
    (function() {
      // Translation strings
      var translations = {
        en: {
          title: "You're Offline",
          message: "It looks like you've lost your internet connection. Don't worry - QuakeWise will work again once you're back online.",
          tryAgain: "Try Again",
          waitingConnection: "Waiting for connection...",
          connectionRestored: "Connection restored! Redirecting...",
          checking: "Checking...",
          availableOffline: "Available Offline:",
          home: "Home"
        },
        tr: {
          title: "Çevrimdışısınız",
          message: "İnternet bağlantınızı kaybetmiş görünüyorsunuz. Endişelenmeyin - tekrar çevrimiçi olduğunuzda QuakeWise çalışacaktır.",
          tryAgain: "Tekrar Dene",
          waitingConnection: "Bağlantı bekleniyor...",
          connectionRestored: "Bağlantı geri yüklendi! Yönlendiriliyor...",
          checking: "Kontrol ediliyor...",
          availableOffline: "Çevrimdışı Kullanılabilir:",
          home: "Ana Sayfa"
        },
        ru: {
          title: "Вы офлайн",
          message: "Похоже, вы потеряли подключение к интернету. Не волнуйтесь — QuakeWise снова заработает, когда вы вернётесь в сеть.",
          tryAgain: "Попробовать снова",
          waitingConnection: "Ожидание подключения...",
          connectionRestored: "Подключение восстановлено! Перенаправление...",
          checking: "Проверка...",
          availableOffline: "Доступно офлайн:",
          home: "Главная"
        }
      };

      // Detect locale from localStorage or URL
      function getLocale() {
        try {
          // Try to get from localStorage
          var storedLocale = localStorage.getItem('locale');
          if (storedLocale && translations[storedLocale]) {
            return storedLocale;
          }

          // Try to get from URL path
          var path = window.location.pathname;
          var pathParts = path.split('/').filter(Boolean);
          if (pathParts.length > 0 && translations[pathParts[0]]) {
            return pathParts[0];
          }
        } catch (e) {
          // Ignore localStorage errors
        }

        // Default to English
        return 'en';
      }

      // Apply translations
      function applyTranslations() {
        var locale = getLocale();
        var t = translations[locale] || translations.en;

        document.getElementById('title').textContent = t.title;
        document.getElementById('message').textContent = t.message;
        document.getElementById('retryText').textContent = t.tryAgain;
        document.getElementById('statusText').textContent = t.waitingConnection;
        document.getElementById('cachedPagesTitle').textContent = t.availableOffline;
        document.getElementById('homeLink').textContent = t.home;
        document.documentElement.lang = locale;
      }

      var statusDot = document.getElementById('statusDot');
      var statusText = document.getElementById('statusText');
      var retryButton = document.getElementById('retryButton');
      var retryText = document.getElementById('retryText');
      var cachedPages = document.getElementById('cachedPages');

      function updateStatus() {
        var locale = getLocale();
        var t = translations[locale] || translations.en;

        if (navigator.onLine) {
          statusDot.classList.add('online');
          statusText.textContent = t.connectionRestored;
          setTimeout(function() {
            window.location.reload();
          }, 1000);
        } else {
          statusDot.classList.remove('online');
          statusText.textContent = t.waitingConnection;
        }
      }

      function retryConnection() {
        var locale = getLocale();
        var t = translations[locale] || translations.en;

        retryButton.disabled = true;
        retryButton.classList.add('loading');
        retryText.textContent = t.checking;

        fetch('/', { cache: 'no-store' })
          .then(function(response) {
            if (response.ok) {
              window.location.reload();
            } else {
              throw new Error('Still offline');
            }
          })
          .catch(function() {
            retryButton.disabled = false;
            retryButton.classList.remove('loading');
            retryText.textContent = t.tryAgain;
          });
      }

      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);

      retryButton.addEventListener('click', retryConnection);

      // Apply translations on load
      applyTranslations();
      updateStatus();

      if ('caches' in window) {
        caches.keys().then(function(cacheNames) {
          if (cacheNames.length > 0) {
            cachedPages.style.display = 'block';
          }
        });
      }
    })();
  </script>
</body>
</html>
